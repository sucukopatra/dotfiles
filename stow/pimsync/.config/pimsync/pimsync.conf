status_path "~/.local/share/pimsync/status/"

storage calendars_local {
	type vdir/icalendar
	path ~/.local/share/calendars/
}

storage calendars_remote {
	type caldav
	url {
		shell sed -n 1p ~/.local/share/pimsync/credentials
	}
	username {
		shell sed -n 2p ~/.local/share/pimsync/credentials
	}
	password {
		shell sed -n 3p ~/.local/share/pimsync/credentials
	}
}

pair calendars {
	storage_a calendars_local
	storage_b calendars_remote
	collections all
}
